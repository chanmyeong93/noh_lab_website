<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="news_site_title">News - Noh Lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===================================================================
       [헤더 및 네비게이션 영역]
       =================================================================== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">N</span>
        <span class="brand-name" data-i18n="site_brand_name">노윤하 교수 Lab</span>
      </a>
      <nav class="site-nav">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="research.html" data-i18n="nav_research">Research</a>
        <a href="publications.html" data-i18n="nav_publications">Publications</a>
        <a href="members.html" data-i18n="nav_members">Members</a>
        <a href="news.html" class="active" data-i18n="nav_news">News</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
        <button id="lang-toggle-btn" class="lang-btn">EN</button>
      </nav>
    </div>
  </header>

  <!-- ===================================================================
       [메인 컨텐츠 영역]
       =================================================================== -->
  <main class="container section">
    <div class="news-header-actions">
      <h1 class="page-title" data-i18n="news_page_title">News & Activity</h1>
      <button id="open-write-btn" class="btn btn-primary" data-i18n="news_btn_write">+ 소식 작성하기</button>
    </div>

    <!-- 뉴스 게시글 목록 -->
    <div id="news-container" class="news-feed"></div>
  </main>

  <!-- ===================================================================
       [글쓰기 모달 창]
       =================================================================== -->
  <div id="news-modal" class="modal-backdrop" style="display:none;">
    <div class="modal-content">
      <!-- 우측 상단 X 닫기 버튼 -->
      <button id="close-modal-x" class="modal-close-x">&times;</button>
      <h3 data-i18n="modal_title">새 소식 등록</h3>
      <form id="news-form">
        <input type="text" id="news-title" data-i18n-placeholder="modal_ph_title" placeholder="제목을 입력하세요" required>
        <textarea id="news-body" rows="4" data-i18n-placeholder="modal_ph_body" placeholder="내용을 입력하세요" required></textarea>
        
        <!-- [이미지 첨부 및 취소 기능] -->
        <label style="display:block; margin-bottom: 6px; font-weight:600; font-size:0.85rem;" data-i18n="modal_label_img">사진 첨부 (선택):</label>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
          <input type="file" id="news-img-input" accept="image/*" style="flex:1;">
          <button type="button" id="clear-img-btn" class="btn" style="display:none; padding:4px 8px; font-size:0.75rem; background-color:#ef4444; color:#fff; border:none; border-radius:4px; cursor:pointer;" data-i18n="modal_btn_clear_img">선택 취소</button>
        </div>
        
        <input type="password" id="admin-pass" data-i18n-placeholder="modal_ph_pass" placeholder="관리자 비밀번호" required>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
          <button type="submit" class="btn btn-primary" data-i18n="modal_btn_submit">등록하기</button>
          <button type="button" id="close-modal-btn" class="btn btn-secondary" style="color:var(--text-main);" data-i18n="modal_btn_cancel">취소</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/news-admin.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
